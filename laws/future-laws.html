<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Future Law Registry | SAP-0 Pipeline</title>

<link rel="icon" href="../assets/favicon.ico" />
<link href="../css/styles.css" rel="stylesheet" />

<style>

body {
  background: #fff;
  font-family: Arial, sans-serif;
}

.header {
  background: #111;
  color: #fff;
  padding: 80px 20px 60px;
  text-align: center;
}

.meta {
  font-size: 0.75rem;
  opacity: 0.6;
  letter-spacing: 0.15em;
}

h1 {
  margin-top: 10px;
}

.subtitle {
  max-width: 900px;
  margin: 20px auto 0;
  opacity: 0.75;
  line-height: 1.6;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 40px 20px;
}

.card {
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
}

.title {
  font-size: 1.2rem;
  font-weight: bold;
}

.meta-line {
  font-size: 0.85rem;
  opacity: 0.7;
  margin-top: 5px;
}

.block {
  margin-top: 10px;
  font-size: 0.95rem;
  line-height: 1.5;
}

.tag {
  display: inline-block;
  font-size: 0.75rem;
  padding: 3px 10px;
  border: 1px solid #ccc;
  border-radius: 999px;
  margin-top: 8px;
}

.status {
  display: inline-block;
  font-size: 0.75rem;
  padding: 3px 10px;
  border-radius: 999px;
  margin-left: 5px;
}

.APPROVED { border: 1px solid green; color: green; }
.WEAK { border: 1px solid orange; color: orange; }
.REJECTED { border: 1px solid red; color: red; }

.actions {
  margin-top: 12px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  padding: 8px 12px;
  border: 1px solid #111;
  background: #111;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button.secondary {
  background: white;
  color: black;
}

.empty {
  text-align: center;
  opacity: 0.6;
  padding: 40px;
  border: 1px dashed #ccc;
  border-radius: 12px;
}

</style>

</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="meta">SAP-0 VALIDATION ENGINE</div>

  <h1>Future Law Registry</h1>

  <div class="subtitle">
    Candidate laws awaiting SAP-0 evaluation. Only structurally aligned entries may be promoted to the canonical registry.
  </div>

</header>

<!-- CONTENT -->
<div class="container" id="container"></div>

<script>

function getFutureLaws() {
  return JSON.parse(localStorage.getItem("rd0_future_laws") || "[]");
}

function getRegistry() {
  return JSON.parse(localStorage.getItem("rd0_law_registry") || "[]");
}

function saveFutureLaws(data) {
  localStorage.setItem("rd0_future_laws", JSON.stringify(data));
}

function saveRegistry(data) {
  localStorage.setItem("rd0_law_registry", JSON.stringify(data));
}

/* ---------------- SAP-0 ENGINE ---------------- */

function sap0Score(entry) {

  let score = 0;

  const text = (entry.signal + " " + entry.context).toLowerCase();

  const keywords = ["system", "structure", "model", "law", "mapping", "alignment"];

  keywords.forEach(k => {
    if (text.includes(k)) score += 10;
  });

  if (entry.signal?.includes("→") || entry.signal?.includes("=")) score += 15;

  const weak = ["maybe", "kind of", "feels like", "i think"];

  weak.forEach(w => {
    if (text.includes(w)) score -= 10;
  });

  if (entry.tag?.includes("RD-0I")) score += 10;
  if (entry.tag?.includes("RD-0E")) score += 5;
  if (entry.tag?.includes("RD-0H")) score += 2;

  return Math.max(0, Math.min(100, score));
}

function classify(score) {
  if (score >= 70) return "APPROVED";
  if (score >= 40) return "WEAK";
  return "REJECTED";
}

/* ---------------- ACTIONS ---------------- */

function promoteToRegistry(i) {

  let future = getFutureLaws();
  let registry = getRegistry();

  const entry = future[i];
  const score = sap0Score(entry);

  if (score < 70) {
    alert("SAP-0 REJECTED — insufficient structural alignment");
    return;
  }

  registry.unshift(entry);
  saveRegistry(registry);

  alert("PROMOTED TO LAW REGISTRY ✔");

}

function remove(i) {

  let future = getFutureLaws();
  future.splice(i, 1);
  saveFutureLaws(future);

  render();
}

/* ---------------- RENDER ---------------- */

function render() {

  const container = document.getElementById("container");
  const future = getFutureLaws();

  container.innerHTML = "";

  if (future.length === 0) {
    container.innerHTML = `
      <div class="empty">
        No Future Law candidates available.<br><br>
        Journal entries must be promoted first.
      </div>
    `;
    return;
  }

  future.forEach((entry, i) => {

    const score = sap0Score(entry);
    const status = classify(score);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="title">${entry.title}</div>

      <div class="meta-line">
        TYPE: ${entry.type} • CONFIDENCE: ${entry.confidence}
      </div>

      <div class="block"><b>CONTEXT:</b> ${entry.context}</div>
      <div class="block"><b>SIGNAL:</b> ${entry.signal}</div>

      <div class="block"><b>SAP-0 SCORE:</b> ${score}/100</div>

      <div>
        <span class="tag">${entry.tag}</span>
        <span class="status ${status}">${status}</span>
      </div>

      <div class="actions">

        <button onclick="promoteToRegistry(${i})">
          Promote to Registry
        </button>

        <button class="secondary" onclick="remove(${i})">
          Remove
        </button>

      </div>
    `;

    container.appendChild(card);

  });

}

render();

</script>

</body>
</html>
