<body>

<header class="header">

  <div class="meta">RD-0 LAW REGISTRY</div>

  <h1>Canonical Registry</h1>

  <div class="subtitle">
    Only SAP-0 approved laws exist in this layer. This is the system of record.
  </div>

</header>

<div class="container-narrow" id="registryContainer" style="padding:40px 20px;"></div>

<footer class="footer">
  RD-0 LAW REGISTRY • CANONICAL SYSTEM
</footer>

<script>

function loadRegistry() {

  const container = document.getElementById("registryContainer");

  let registry = JSON.parse(localStorage.getItem("rd0_law_registry") || "[]");

  container.innerHTML = "";

  if (!registry.length) {
    container.innerHTML = `
      <div style="text-align:center; opacity:0.6; padding:40px; border:1px dashed #ccc; border-radius:12px;">
        No canonical laws registered yet.<br><br>
        SAP-0 approved entries will appear here.
      </div>
    `;
    return;
  }

  registry.forEach((entry, i) => {

    const card = document.createElement("div");
    card.className = "card";
    card.style.border = "1px solid rgba(0,0,0,0.1)";
    card.style.borderRadius = "12px";
    card.style.padding = "16px";
    card.style.marginBottom = "12px";

    card.innerHTML = `
      <div style="font-weight:bold; font-size:1.1rem;">${entry.title || "Untitled Law"}</div>
      <div style="font-size:0.8rem; opacity:0.6; margin-top:4px;">
        ${entry.type || ""} • ${entry.confidence || ""}
      </div>

      <div style="margin-top:10px; font-size:0.9rem;">
        <b>Signal:</b> ${entry.signal || ""}
      </div>

      <div style="margin-top:8px; font-size:0.9rem;">
        <b>Context:</b> ${entry.context || ""}
      </div>
    `;

    container.appendChild(card);

  });

}

loadRegistry();

</script>

</body>
