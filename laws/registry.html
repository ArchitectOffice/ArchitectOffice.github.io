<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>RD-0 Law Registry | Canonical System</title>

<link rel="icon" href="../assets/favicon.ico" />
<link href="../css/styles.css" rel="stylesheet" />

<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

<style>

body {
  background: #fff;
}

.header {
  background: #111;
  color: #fff;
  padding: 80px 20px 60px;
  text-align: center;
}

.meta {
  font-size: 0.75rem;
  opacity: 0.6;
  letter-spacing: 0.15em;
}

h1 {
  margin-top: 10px;
  font-weight: 700;
}

.subtitle {
  max-width: 900px;
  margin: 20px auto 0;
  opacity: 0.75;
  line-height: 1.7;
}

.container-narrow {
  max-width: 1000px;
  margin: 0 auto;
}

.section {
  padding: 50px 20px;
}

.card {
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 18px;
  background: #fff;
}

.title {
  font-size: 1.3rem;
  font-weight: 700;
}

.meta-line {
  font-size: 0.85rem;
  opacity: 0.7;
  margin-top: 6px;
}

.block {
  margin-top: 12px;
  line-height: 1.6;
  opacity: 0.9;
}

.tag {
  display: inline-block;
  font-size: 0.75rem;
  padding: 4px 10px;
  border: 1px solid rgba(0,0,0,0.15);
  border-radius: 999px;
  margin-top: 10px;
  margin-right: 5px;
}

.law-id {
  font-size: 0.75rem;
  opacity: 0.6;
  margin-top: 8px;
}

.empty {
  text-align: center;
  opacity: 0.6;
  padding: 40px;
  border: 1px dashed rgba(0,0,0,0.2);
  border-radius: 12px;
}

.footer {
  text-align: center;
  padding: 50px 20px;
  opacity: 0.5;
  font-size: 0.85rem;
  border-top: 1px solid rgba(0,0,0,0.08);
}

</style>

</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="meta">RD-0 CANONICAL SYSTEM</div>

  <h1>Law Registry</h1>

  <div class="subtitle">
    Authoritative storage layer for validated RD-0 laws.
    Only SAP-0 approved and structurally coherent outputs are promoted into this registry.
  </div>

</header>

<!-- CONTENT -->
<section class="section">

  <div class="container-narrow" id="registryContainer"></div>

</section>

<!-- FOOTER -->
<footer class="footer">
  RD-0 LAW REGISTRY • CANONICAL TRUTH LAYER • ARCHITECT OFFICE
</footer>

<script>

function loadRegistry() {

  const container = document.getElementById("registryContainer");

  // For now: pull approved future laws from localStorage pipeline
  let journal = JSON.parse(localStorage.getItem("rd0_journal") || "[]");

  if (journal.length === 0) {

    container.innerHTML = `
      <div class="empty">
        No canonical laws exist yet.<br><br>
        Promote validated Future Laws through SAP-0.
      </div>
    `;

    return;
  }

  container.innerHTML = "";

  journal.forEach((entry, index) => {

    const lawId = "LAW-" + String(index + 1).padStart(3, "0");

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `

      <div class="title">${entry.title}</div>

      <div class="meta-line">
        TYPE: ${entry.type} • CONFIDENCE: ${entry.confidence}
      </div>

      <div class="law-id">${lawId}</div>

      <div class="block"><b>CORE SIGNAL:</b> ${entry.signal}</div>

      <div class="block"><b>CONTEXT:</b> ${entry.context}</div>

      <div class="block"><b>TAG:</b> ${entry.tag}</div>

      <div class="block"><b>TIMESTAMP:</b> ${new Date(entry.timestamp).toLocaleString()}</div>

    `;

    container.appendChild(card);

  });

}

window.onload = loadRegistry;

</script>

</body>

</html>
