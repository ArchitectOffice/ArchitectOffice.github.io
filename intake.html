<!-- HEADER -->
<header class="bg-dark text-white">

  <div class="container px-4 text-center">

    <h1 class="fw-bolder">Structured Intake</h1>

    <p class="lead">
      System classification layer for RD-0, OSD, and AI Cognitive Lens diagnostics.
    </p>

  </div>

</header>

<!-- FORM SECTION -->
<section class="py-5">

  <div class="container px-4">

    <div class="row justify-content-center">

      <div class="col-lg-8">

        <div class="p-4 p-md-5 border rounded bg-white shadow-sm">

          <h2 class="mb-3">Diagnostic Intake</h2>

          <p class="text-muted mb-4">
            Provide structured input to classify system instability before engagement.
          </p>

          <form action="https://formspree.io/f/mvzlndnl" method="POST">

            <!-- SYSTEM TYPE -->
            <div class="mb-3">
              <label class="form-label">System Type</label>
              <select class="form-select" name="system_type" required>
                <option value="">Select...</option>
                <option>RD-0 Rapid Diagnostic</option>
                <option>OSD Operational Systems Diagnostics</option>
                <option>AI Cognitive Lens</option>
              </select>
            </div>

            <!-- CURRENT STATE -->
            <div class="mb-3">
              <label class="form-label">Current State</label>
              <textarea class="form-control" name="current_state" rows="4" required></textarea>
            </div>

            <!-- EXPECTED STATE -->
            <div class="mb-3">
              <label class="form-label">Expected State</label>
              <textarea class="form-control" name="expected_state" rows="4" required></textarea>
            </div>

            <!-- BREAKDOWN -->
            <div class="mb-3">
              <label class="form-label">Breakdown Point</label>
              <textarea class="form-control" name="breakdown_point" rows="3"></textarea>
            </div>

            <!-- STABILITY -->
            <div class="mb-3">
              <label class="form-label">Stability Pattern</label>
              <select class="form-select" name="stability_pattern">
                <option>Stable</option>
                <option>Intermittent</option>
                <option>Degrading</option>
                <option>Unknown</option>
              </select>
            </div>

            <!-- SYSTEMS -->
            <div class="mb-3">
              <label class="form-label">Systems Involved</label>
              <textarea class="form-control" name="systems_involved" rows="3"></textarea>
            </div>

            <!-- EMAIL -->
            <div class="mb-4">
              <label class="form-label">Email</label>
              <input class="form-control" type="email" name="email" required>
            </div>

            <button class="btn btn-dark w-100" type="submit">
              Submit Diagnostic Intake
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

</section>
