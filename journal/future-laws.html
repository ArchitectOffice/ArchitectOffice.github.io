<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Future Law Registry | SAP-0 Pipeline</title>

<link rel="icon" href="../assets/favicon.ico" />
<link href="../css/styles.css" rel="stylesheet" />

<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

<style>

body {
  background: #fff;
}

.header {
  background: #111;
  color: #fff;
  padding: 80px 20px 60px;
  text-align: center;
}

.meta {
  font-size: 0.75rem;
  opacity: 0.6;
  letter-spacing: 0.15em;
}

h1 {
  margin-top: 10px;
  font-weight: 700;
}

.subtitle {
  max-width: 900px;
  margin: 20px auto 0;
  opacity: 0.75;
  line-height: 1.7;
}

.container-narrow {
  max-width: 1000px;
  margin: 0 auto;
}

.section {
  padding: 50px 20px;
}

.card {
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 18px;
  background: #fff;
}

.title {
  font-size: 1.2rem;
  font-weight: 600;
}

.meta-line {
  font-size: 0.85rem;
  opacity: 0.7;
  margin-top: 6px;
}

.block {
  margin-top: 12px;
  line-height: 1.6;
  opacity: 0.9;
}

.tag {
  display: inline-block;
  font-size: 0.75rem;
  padding: 4px 10px;
  border: 1px solid rgba(0,0,0,0.15);
  border-radius: 999px;
  margin-top: 10px;
  margin-right: 5px;
}

.status {
  display: inline-block;
  font-size: 0.75rem;
  padding: 4px 10px;
  border-radius: 999px;
  margin-top: 10px;
  margin-left: 5px;
}

.status.APPROVED {
  border: 1px solid #2e7d32;
  color: #2e7d32;
}

.status.WEAK {
  border: 1px solid #ff9800;
  color: #ff9800;
}

.status.REJECTED {
  border: 1px solid #c62828;
  color: #c62828;
}

.actions {
  margin-top: 15px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid #111;
  background: #111;
  color: #fff;
  font-size: 0.85rem;
  cursor: pointer;
}

.btn.secondary {
  background: #fff;
  color: #111;
}

.btn:hover {
  opacity: 0.85;
}

.empty {
  text-align: center;
  opacity: 0.6;
  padding: 40px;
  border: 1px dashed rgba(0,0,0,0.2);
  border-radius: 12px;
}

.footer {
  text-align: center;
  padding: 50px 20px;
  opacity: 0.5;
  font-size: 0.85rem;
  border-top: 1px solid rgba(0,0,0,0.08);
}

</style>

</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="meta">RD-0 / SAP-0 VALIDATION LAYER</div>

  <h1>Future Law Registry</h1>

  <div class="subtitle">
    Candidate law queue derived from journal signals.
    Each entry is evaluated through the SAP-0 alignment engine before promotion to canonical RD-0 law status.
  </div>

</header>

<!-- CONTENT -->
<section class="section">

  <div class="container-narrow" id="lawContainer"></div>

</section>

<!-- FOOTER -->
<footer class="footer">
  RD-0 LAW PIPELINE • SAP-0 ENGINE • ARCHITECT OFFICE
</footer>

<!-- ENGINE -->
<script>

function sap0Score(entry) {

  let score = 0;

  const text = (entry.signal + " " + entry.context).toLowerCase();

  const structuredKeywords = [
    "system", "structure", "mapping", "alignment",
    "model", "function", "law", "space", "domain"
  ];

  structuredKeywords.forEach(k => {
    if (text.includes(k)) score += 10;
  });

  if (entry.signal.includes("→") || entry.signal.includes("=")) {
    score += 15;
  }

  const weakWords = ["maybe", "feels like", "i think", "kind of"];

  weakWords.forEach(w => {
    if (text.includes(w)) score -= 10;
  });

  if (entry.tag && entry.tag.includes("RD-0I")) score += 10;
  if (entry.tag && entry.tag.includes("RD-0E")) score += 5;
  if (entry.tag && entry.tag.includes("RD-0H")) score += 2;

  return Math.max(0, Math.min(100, score));
}

function classify(score) {

  if (score >= 70) return "APPROVED";
  if (score >= 40) return "WEAK";
  return "REJECTED";

}

function loadFutureLaws() {

  const container = document.getElementById("lawContainer");

  let journal = JSON.parse(localStorage.getItem("rd0_journal") || "[]");

  container.innerHTML = "";

  if (journal.length === 0) {

    container.innerHTML = `
      <div class="empty">
        No law candidates detected.<br><br>
        Create journal entries to activate SAP-0 pipeline.
      </div>
    `;

    return;
  }

  journal.forEach((entry, index) => {

    const score = sap0Score(entry);
    const status = classify(score);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `

      <div class="title">${entry.title}</div>

      <div class="meta-line">
        TYPE: ${entry.type} • CONFIDENCE: ${entry.confidence}
      </div>

      <div class="block"><b>CONTEXT:</b> ${entry.context}</div>

      <div class="block"><b>SIGNAL:</b> ${entry.signal}</div>

      <div class="block"><b>REPEATABILITY:</b> ${entry.repeatability}</div>

      <div class="block"><b>TIMESTAMP:</b> ${new Date(entry.timestamp).toLocaleString()}</div>

      <div class="block">
        <b>SAP-0 SCORE:</b> ${score} / 100
      </div>

      <div>
        <span class="tag">${entry.tag}</span>
        <span class="status ${status}">${status}</span>
      </div>

      <div class="actions">

        <button class="btn" onclick="promote(${index})">
          Promote to Law
        </button>

        <button class="btn secondary" onclick="archive(${index})">
          Archive
        </button>

      </div>

    `;

    container.appendChild(card);

  });

}

function promote(i) {

  let journal = JSON.parse(localStorage.getItem("rd0_journal") || "[]");

  const entry = journal[i];

  alert("Promoted to RD-0 candidate:\n\n" + entry.title);

  // future: move to canonical law registry
}

function archive(i) {

  let journal = JSON.parse(localStorage.getItem("rd0_journal") || "[]");

  journal.splice(i, 1);

  localStorage.setItem("rd0_journal", JSON.stringify(journal));

  loadFutureLaws();

}

window.onload = loadFutureLaws;

</script>

</body>

</html>
