<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Journal | RD-0 Signal Registry</title>

<link rel="icon" href="../assets/favicon.ico" />
<link href="../css/styles.css" rel="stylesheet" />

<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

<style>

body {
  background: #fff;
}

.header {
  background: #111;
  color: #fff;
  padding: 80px 20px 60px;
  text-align: center;
}

.meta {
  font-size: 0.75rem;
  opacity: 0.6;
  letter-spacing: 0.15em;
}

h1 {
  margin-top: 10px;
  font-weight: 700;
}

.subtitle {
  max-width: 900px;
  margin: 20px auto 0;
  opacity: 0.75;
  line-height: 1.7;
}

.container-narrow {
  max-width: 900px;
  margin: 0 auto;
}

.section {
  padding: 50px 20px;
}

.entry-card {
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 14px;
  padding: 25px;
  margin-bottom: 20px;
  background: #fff;
}

.label {
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  opacity: 0.5;
  margin-bottom: 8px;
}

.title {
  font-size: 1.2rem;
  font-weight: 600;
}

.meta-line {
  font-size: 0.85rem;
  opacity: 0.7;
  margin-top: 8px;
}

.block {
  margin-top: 15px;
  line-height: 1.7;
  opacity: 0.9;
}

.tag {
  display: inline-block;
  font-size: 0.75rem;
  padding: 4px 10px;
  border: 1px solid rgba(0,0,0,0.15);
  border-radius: 999px;
  margin-top: 10px;
  margin-right: 5px;
}

.cta {
  text-align: center;
  padding: 30px 0;
}

.btn-law {
  display: inline-block;
  padding: 10px 18px;
  border: 1px solid #111;
  border-radius: 8px;
  text-decoration: none;
  color: #111;
  font-weight: 500;
}

.btn-law:hover {
  background: #111;
  color: #fff;
}

.footer {
  text-align: center;
  padding: 50px 20px;
  opacity: 0.5;
  font-size: 0.85rem;
  border-top: 1px solid rgba(0,0,0,0.08);
}

</style>

</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="meta">RD-0 SIGNAL REGISTRY</div>

  <h1>Journal</h1>

  <div class="subtitle">
    Structured capture layer for system observations, interaction drift, and emergent behavioural patterns.
    Entries are dynamically rendered from the RD-0 journal store.
  </div>

</header>

<!-- CTA -->
<section class="cta">

  <a class="btn-law" href="entry-template.html">
    + New Journal Entry
  </a>

</section>

<!-- ENTRIES -->
<section class="section">

  <div class="container-narrow" id="journalContainer">

    <!-- dynamic entries injected here -->

  </div>

</section>

<!-- FOOTER -->
<footer class="footer">
  RD-0 JOURNAL SYSTEM • LIVE REGISTRY NODE • ARCHITECT OFFICE
</footer>

<!-- RENDER ENGINE -->
<script>

function loadJournal() {

  const container = document.getElementById("journalContainer");

  let journal = JSON.parse(localStorage.getItem("rd0_journal") || "[]");

  container.innerHTML = "";

  if (journal.length === 0) {

    container.innerHTML = `
      <div class="entry-card">
        <div class="label">SYSTEM</div>
        <div class="title">No Journal Entries Found</div>
        <div class="block">
          Capture your first RD-0 signal using the entry interface.
        </div>
      </div>
    `;

    return;
  }

  journal.forEach(entry => {

    const card = document.createElement("div");
    card.className = "entry-card";

    card.innerHTML = `

      <div class="label">TYPE: ${entry.type}</div>

      <div class="title">${entry.title}</div>

      <div class="meta-line">
        CONFIDENCE: ${entry.confidence} • ${new Date(entry.timestamp).toLocaleString()}
      </div>

      <div class="block"><b>CONTEXT:</b> ${entry.context}</div>

      <div class="block"><b>RAW:</b> ${entry.raw}</div>

      <div class="block"><b>SIGNAL:</b> ${entry.signal}</div>

      <div class="block"><b>REPEATABILITY:</b> ${entry.repeatability}</div>

      <div>
        <span class="tag">${entry.tag}</span>
      </div>

    `;

    container.appendChild(card);

  });

}

window.onload = loadJournal;

</script>

</body>

</html>
