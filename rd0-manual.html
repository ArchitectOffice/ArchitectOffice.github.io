    margin: 0;
    background: #111;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;

  .topbar {
    padding: 14px 20px;
    background: #0b0b0b;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
